services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
    - "80:80"
    environment:
      REDIS_HOST: redis://redis:6379
      RTT_USERNAME: ${RTT_USERNAME}
      RTT_PASSWORD: ${RTT_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
    depends_on:
      - redis
      - db
    networks:
      - web
    restart: on-failure

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    networks:
      - web

  db:
    image: imresamu/postgis
    container_name: nextbus_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init_db:/docker-entrypoint-initdb.d
    networks:
      - web


networks:
  web:
    driver: bridge

volumes:
  postgres_data:
  redis_data: