services:
  traefik:
    image: traefik:latest
    command:
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - web
    restart: unless-stopped

  nginx:
    build:
      context: .
      dockerfile: Dockerfile.nginx
      args:
        COMMIT: ${COMMIT:-dev}
    expose:
      - "8081"
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.nginx.rule=HostRegexp(`^(.+\\.)?orbitix\\.dev$|^(.+\\.)?nextbus\\.cc$|^(.+\\.)?nextbus\\.org\\.uk$|^localhost$|^192\\.168\\.[0-9]{1,3}\\.[0-9]{1,3}$`)"
      - "traefik.http.routers.nginx.entrypoints=web"
      - "traefik.http.services.nginx.loadbalancer.server.port=8081"
      - "traefik.http.routers.nginx.priority=1"
    depends_on:
      - app
    networks:
      - web
    restart: unless-stopped
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
      args:
        COMMIT: ${COMMIT:-dev}
    expose:
      - "8000"
    environment:
      REDIS_HOST: redis://redis:6379
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_TEST_HOST: test-db
      MACHINE_NAME: ${MACHINE_NAME}
      BOT_TOKEN: ${BOT_TOKEN}
      BODS_API_KEY: ${BODS_API_KEY}
      PYTHONUNBUFFERED: 1
      TZ: Europe/London
      ENV: production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=HostRegexp(`^(.+\\.)?orbitix\\.dev$|^(.+\\.)?nextbus\\.cc$|^(.+\\.)?nextbus\\.org\\.uk$|^localhost$|^192\\.168\\.[0-9]{1,3}\\.[0-9]{1,3}$`) && PathRegexp(`^/api(/.*)?$|^/ws(/.*)?$`)"
      - "traefik.http.routers.app.entrypoints=web"
      - "traefik.http.services.app.loadbalancer.server.port=8000"
      # - "traefik.http.services.app.loadbalancer.sticky.cookie=true"
      - "traefik.http.routers.app.priority=100"
      - autoheal=true
    depends_on:
      - redis
      - db
      - migrate
    networks:
      - web
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health/"]
      interval: 30s
      timeout: 5s
      retries: 3
    deploy:
      replicas: 2   
      update_config:
        parallelism: 1 
        failure_action: rollback
        delay: 5s
      restart_policy:
        condition: on-failure

  scheduler:
    image: nextbus-app:latest 
    command: ["python", "-m", "backend.scheduler"]
    environment:
      REDIS_HOST: redis://redis:6379
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_TEST_HOST: test-db
      MACHINE_NAME: ${MACHINE_NAME}
      BOT_TOKEN: ${BOT_TOKEN}
      BODS_API_KEY: ${BODS_API_KEY}
      PYTHONUNBUFFERED: 1
      TZ: Europe/London
      ENV: production
    restart: always
    depends_on:
      - app
    networks:
      - web

  bot:
    image: nextbus-app:latest 
    command: ["python", "-m", "backend.bot.bot_runner"]
    environment:
      REDIS_HOST: redis://redis:6379
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_TEST_HOST: test-db
      MACHINE_NAME: ${MACHINE_NAME}
      BOT_TOKEN: ${BOT_TOKEN}
      BOT_DISABLED: ${BOT_DISABLED}
      BODS_API_KEY: ${BODS_API_KEY}
      PYTHONUNBUFFERED: 1
      TZ: Europe/London
      ENV: production
    deploy:
      replicas: 1
    depends_on:
      - redis
      - db
      - migrate
    networks:
      - web

  migrate:
    image: nextbus-app:latest 
    command: alembic upgrade head
    environment:
      RTT_USERNAME: ${RTT_USERNAME}
      RTT_PASSWORD: ${RTT_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      POSTGRES_TEST_HOST: test-db
      PYTHONUNBUFFERED: 1
      TZ: Europe/London
      ENV: production
    networks:
      - web
    depends_on:
      - db
      - test-db

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - web

  db:
    image: imresamu/postgis:latest
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./backend/db/init_db:/docker-entrypoint-initdb.d
    networks:
      - web
    
  test-db:
    image: imresamu/postgis:latest
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: nextbus
      POSTGRES_PASSWORD: nextbus
      POSTGRES_DB: nextbus_test
    volumes:
      - ./backend/db/init_db:/docker-entrypoint-initdb.d
    networks:
      - web
    
  autoheal:
    image: willfarrell/autoheal
    restart: always
    environment:
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=60
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock


networks:
  web:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  frontend_dist: