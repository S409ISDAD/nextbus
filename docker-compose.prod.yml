services:
  traefik:
    image: traefik:v3.5
    command:
      - "--providers.docker=true"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.websecure.address=:443"
    ports:
      - "80:80"
      - "443:443"
      - "8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./traefik/dynamic:/etc/traefik/dynamic:ro
    networks:
      - web
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    expose:
      - "80"
    environment:
      REDIS_HOST: redis://redis:6379
      RTT_USERNAME: ${RTT_USERNAME}
      RTT_PASSWORD: ${RTT_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      BOT_TOKEN: ${BOT_TOKEN}
      PYTHONUNBUFFERED: 1
      TZ: Europe/London
      ENV: production
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`localhost`) || Host(`nextbus.orbitix.dev`) || Host(`192.168.4.211`)"
      - "traefik.http.routers.app.entrypoints=web"
      - "traefik.http.routers.app.tls=false"
      - "traefik.http.services.app.loadbalancer.server.port=80"
      - "traefik.http.services.app.loadbalancer.sticky.cookie=true"
      - "traefik.http.routers.app.priority=2"
    depends_on:
      - redis
      - db
    networks:
      - web
    deploy:
      replicas: 2   
      update_config:
        parallelism: 1 
        failure_action: rollback
        delay: 5s
      restart_policy:
        condition: on-failure

  bot:
    image: nextbus-app:latest 
    command: ["python", "-m", "backend.bot.bot_runner"]
    environment:
      REDIS_HOST: redis://redis:6379
      RTT_USERNAME: ${RTT_USERNAME}
      RTT_PASSWORD: ${RTT_PASSWORD}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: db
      BOT_TOKEN: ${BOT_TOKEN}
      PYTHONUNBUFFERED: 1
      TZ: Europe/London
      ENV: production
    deploy:
      replicas: 1


  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - web

  db:
    image: imresamu/postgis
    container_name: nextbus_db
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/db/init_db:/docker-entrypoint-initdb.d
    networks:
      - web


networks:
  web:
    driver: bridge

volumes:
  postgres_data:
  redis_data: